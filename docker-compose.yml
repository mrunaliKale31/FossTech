version: '3.8'

services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud-git-integration
    ports:
      - "8090:80"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=nextcloud
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
    volumes:
      - nextcloud_data:/var/www/html
      - ./:/var/www/html/custom_apps/gitintegration:ro
    depends_on:
      - db
    networks:
      - nextcloud-network

  db:
    image: postgres:15-alpine
    container_name: nextcloud-postgres
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=nextcloud
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - nextcloud-network

  adminer:
    image: adminer:latest
    container_name: nextcloud-adminer
    ports:
      - "8091:8080"
    networks:
      - nextcloud-network
    depends_on:
      - db

volumes:
  nextcloud_data:
    driver: local
  db_data:
    driver: local

networks:
  nextcloud-network:
    driver: bridge
